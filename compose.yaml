services:
  app:
    image: taskflow:latest
    build: .
    container_name: taskflow-app 
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/taskflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [taskflow-net]

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [taskflow-net]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: taskflow-prometheus
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [app]
    restart: unless-stopped
    networks: [taskflow-net]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: taskflow-grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [taskflow-net]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  taskflow-net:
    driver: bridge
